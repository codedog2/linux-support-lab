services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2025.10.0
    hostname: pihole-lab
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "Asia/Tokyo"
      FTLCONF_webserver_api_password: "labdemo"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    restart: unless-stopped
